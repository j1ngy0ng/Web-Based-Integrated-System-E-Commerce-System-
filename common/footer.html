<script>
// Auto push footer to bottom if short content
function pushFooter() {
  const footer = document.getElementById('footer');
  const docHeight = window.innerHeight;
  const footerTop = footer.offsetTop + footer.offsetHeight;
  if (footerTop < docHeight) footer.style.marginTop = (docHeight - footerTop) + 'px';
}
window.addEventListener('resize', pushFooter);
window.addEventListener('load', pushFooter);
</script>
